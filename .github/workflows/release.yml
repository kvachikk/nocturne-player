name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:clean
      - run: npx web-ext build -s dist -a artifacts --overwrite-dest

      # Published so anyone can rebuild and compare against the signed add-on.
      - name: Checksum
        run: |
          cd artifacts
          sha256sum ./*.zip | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
